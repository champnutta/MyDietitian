<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F5EE"/>
      <stop offset="1" stop-color="#EAF3EC"/>
    </linearGradient>
    <linearGradient id="greenTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FBF6"/>
      <stop offset="1" stop-color="#DCECDF"/>
    </linearGradient>
    <linearGradient id="warmTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#F7E6D0"/>
    </linearGradient>
    <linearGradient id="darkTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183D28"/>
      <stop offset="1" stop-color="#0D2418"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#10271A" flood-opacity=".13"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%">
