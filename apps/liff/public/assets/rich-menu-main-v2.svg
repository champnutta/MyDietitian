      .subtitle { font-family: "Leelawadee UI","Tahoma",sans-serif; font-size: 35px; font-weight: 400; fill: #607064; text-anchor: middle; }
      .dark-title { fill: #FFFFFF; }
      .dark-subtitle { fill: #CFE2D4; }
      .line { fill: none; stroke: #146E33; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
      .line-warm { fill: none; stroke: #C86C2B; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
      .line-light { fill: none; stroke: #E8F5EC; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
      .badge { font-family: "Leelawadee UI","Tahoma",sans-serif; font-size: 27px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
    </style>
